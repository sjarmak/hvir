<!doctype html>
<html lang="en">
  <head>

    <title>Beads</title>
    <link rel="stylesheet" href="presentation.css" />

  </head>
  <body class="hvir-guest hvir-panel">
    <main class="hvir-stack">
      <div class="hvir-toolbar">
        <input id="filter" class="hvir-input" type="search" placeholder="Filter beads" aria-label="Filter beads" />

      <p id="status" class="hvir-meta" role="status">Connecting…</p>
      <button id="connect" class="hvir-button" data-variant="regular" type="button" hidden>Connect bd</button>
      <div id="groups" class="hvir-scroll"></div>
    </main>
    <script src="guest-ui.js"></script>
    <script src="host.js"></script>
    <script src="view.js"></script>
    <script src="beads.js"></script>
  </body>
</html>
