<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beads</title>
    <link rel="stylesheet" href="beads.css" />
    <script defer src="beads.js"></script>
  </head>
  <body>
    <main class="beads-shell">
      <header class="beads-toolbar">
        <div>
          <h1>Beads</h1>
          <p id="as-of" class="hvir-meta">No snapshot yet</p>
        </div>
        <button id="refresh" class="hvir-button" type="button">Refresh</button>
      </header>
      <section id="state" class="hvir-state" data-state="loading">
        Reading workspace…
      </section>
      <div id="content" hidden>
        <section>
          <h2>Work</h2>
          <div id="sections" class="beads-sections"></div>
        </section>
        <section>
          <h2>Crew</h2>
          <div id="crew" class="beads-sections"></div>
        </section>
      </div>
    </main>
  </body>
</html>
